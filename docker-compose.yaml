---
services:
  dnscrypt-proxy:
    image: klutchell/dnscrypt-proxy:${DNSCRYPT_IMAGE_TAG}${DNSCRYPT_IMAGE_SHA}
    container_name: dnscrypt-proxy
    restart: always
    ports:
      - "${DNSCRYPT_HOST_DNS_PORT}:5053/udp"
      - "${DNSCRYPT_HOST_DNS_PORT}:5053/tcp"
    networks:
      - dns_network

  pihole:
    image: pihole/pihole:${PIHOLE_IMAGE_TAG}${PIHOLE_IMAGE_SHA}
    container_name: pihole
    ports:
      - "${PIHOLE_HOST_DNS_PORT}:53/tcp"
      - "${PIHOLE_HOST_DNS_PORT}:53/udp"
      - "${PIHOLE_HOST_ADMIN_PORT}:80/tcp"
    environment:
      TZ: ${PIHOLE_TZ}
      FTLCONF_dns_upstreams: 'dnscrypt-proxy#5053'
      FTLCONF_dns_listeningMode: 'ALL'
    env_file:
      - .env.secret
    restart: always
    depends_on:
      - dnscrypt-proxy
    networks:
      - dns_network

networks:
  dns_network:
    name: dns_network
    driver: bridge
